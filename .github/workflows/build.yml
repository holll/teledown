name: Build

# 触发方式：
#   1. 推送到 main 分支时自动构建
#   2. 推送 v* 标签（如 v1.0.0）时自动构建
#   3. 手动触发（仓库 Actions 页面 -> Run workflow）
# 如只想在打标签时构建，删除下方 push.branches 即可
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台失败不阻塞其他平台
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libmagic1 upx ffmpeg

      - name: 安装系统依赖 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libmagic upx ffmpeg

      - name: 执行打包 (build.sh)
        shell: bash
        run: bash build.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: teledown-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error