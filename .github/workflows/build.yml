name: Build

# 触发方式：
#   1. 推送到 main 分支时自动构建
#   2. 推送 v* 标签（如 v1.0.0）时自动构建
#   3. 手动触发（仓库 Actions 页面 -> Run workflow）
# 如只想在打标签时构建，删除下方 push.branches 即可
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

# 创建 Release 需要写 contents 权限（标签触发时生效）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台失败不阻塞其他平台
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libmagic1 upx ffmpeg

      - name: 安装系统依赖 (Windows)
        if: runner.os == 'Windows'
        run: choco install -y upx

      - name: 执行打包 (build.sh)
        shell: bash
        run: bash build.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: teledown-${{ matrix.os }}-py${{ matrix.python-version }}
          # dist/.[!.]* 用于匹配以点开头的配置文件（如 .env.example）
          path: |
            dist/*
            dist/.[!.]*
          if-no-files-found: error

  # 推送 v* 标签时，等 Linux/Windows 构建全部成功后自动创建 Release 并挂上产物
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: teledown-*

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: teledown ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*
            artifacts/**/.[!.]*
          generate_release_notes: true
          fail_on_unmatched_files: false
          # 含 - 的标签（如 v1.0.0-rc1、v1.0.0-beta）标记为预发布版
          prerelease: ${{ contains(github.ref_name, '-') }}