name: Build

# 触发方式：
#   1. 推送到 main 分支时自动构建
#   2. 推送 v* 标签（如 v1.0.0）时自动构建
#   3. 手动触发（仓库 Actions 页面 -> Run workflow）
# 如只想在打标签时构建，删除下方 push.branches 即可
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

# 创建 Release 需要写 contents 权限（标签触发时生效）
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # 一个平台/一种变体失败不阻塞其他
      matrix:
        os: [ubuntu-latest, windows-latest]
        # full     = 全功能版（含 upload，视频使用系统 FFmpeg）
        # noupload = 精简版（无 upload，不需要 FFmpeg）
        variant: [full, noupload]
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libmagic1 upx

      - name: 安装视频自检所需的 FFmpeg (Linux)
        if: runner.os == 'Linux' && matrix.variant == 'full'
        run: sudo apt-get install -y ffmpeg

      - name: 安装系统依赖 (Windows)
        if: runner.os == 'Windows'
        run: choco install -y upx

      - name: 安装视频自检所需的 FFmpeg (Windows)
        if: runner.os == 'Windows' && matrix.variant == 'full'
        run: |
          choco install -y ffmpeg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 执行打包 (build.sh)
        shell: bash
        env:
          UPLOAD_SUPPORT: ${{ matrix.variant == 'full' && '1' || '0' }}
          OUTPUT_NAME: ${{ matrix.variant == 'full' && 'teledown' || 'teledown-noupload' }}
        run: bash build.sh

      - name: 离线回归与打包产物验收
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          OUTPUT_NAME: ${{ matrix.variant == 'full' && 'teledown' || 'teledown-noupload' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            py=venv/Scripts/python.exe
            binary="dist/${OUTPUT_NAME}-windows-x86_64.exe"
          else
            py=venv/bin/python
            binary="dist/${OUTPUT_NAME}-linux-x86_64"
          fi
          "$py" -m pip check
          "$py" -m unittest discover -s tests -v
          test -f "$binary"
          "$binary" --help
          "$binary" self-test "$VARIANT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: teledown-${{ matrix.os }}-${{ matrix.variant }}-py${{ matrix.python-version }}
          # .env.example 是隐藏文件：v4 默认 include-hidden-files=false 会静默跳过，
          # 即使 path 里显式写了 dist/.env.example 也不行，必须显式打开
          include-hidden-files: true
          path: |
            dist/teledown*-linux-x86_64
            dist/teledown*-windows-x86_64.exe
            dist/sign_tasks.example.json
            dist/.env.example
          if-no-files-found: error

  # 推送 v* 标签时，等 Linux/Windows 各变体构建全部成功后自动创建 Release 并挂上产物
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: teledown-*

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: teledown ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # 含 - 的标签（如 v1.0.0-rc1、v1.0.0-beta）标记为预发布版
          prerelease: ${{ contains(github.ref_name, '-') }}

      # 用 gh CLI 遍历上传全部产物（find 会包含 .env.example 等隐藏文件，
      # 避免 glob 不匹配点文件导致配置模板丢失）
      # 注 1：release job 未 checkout，需显式指定 GH_REPO，否则 gh 会用 git 发现仓库报 not a git repository
      # 注 2：GitHub Release 资源名不能以点开头（会自动改写成 default.env.example），
      #       因此配置模板在 Release 中统一叫 env.example
      - name: 上传全部产物到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          find . -type f -print0 | while IFS= read -r -d '' f; do
            if [ "$(basename "$f")" = ".env.example" ]; then
              continue
            fi
            echo "上传: $f"
            gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

          tpl=$(find . -type f -name '.env.example' | head -n 1)
          if [ -n "$tpl" ]; then
            cp "$tpl" env.example
            echo "上传: env.example (源: $tpl)"
            gh release upload "${{ github.ref_name }}" env.example --clobber
          fi
